<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Lecture Attendance</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      font-size: 18px;
      min-height: 50px;
    }

    .success {
      color: #2e7d32;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .info {
      color: #1565c0;
      font-weight: bold;
    }

    .warning {
      color: #ef6c00;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="card">

    <h2>Lecture Attendance</h2>

    <p>
      Scan Student QR Code
    </p>

    <div id="reader"></div>
<div
  id="queueStatus"
  class="info"
  style="margin-top:10px;">

  No pending attendance submissions.

</div>
    <div id="requestStatus" class="info" style="margin-top:6px;">
  Ready to scan.
</div>
    <div id="result">

      <p class="info">
        Starting scanner...
      </p>

    </div>

  </div>


<script>

  // ==========================================
  // GOOGLE APPS SCRIPT WEB APP
  // ==========================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycby_WU_q5AD2U5f8pPG4u1LafAkDxoOKANCpEhM0umHSoeoAdeJtVnlqJiEvLLdBTnVuPw/exec";


  // ==========================================
  // GET LECTURE ID FROM URL
  // ==========================================

  const urlParams =
    new URLSearchParams(window.location.search);

  const lectureID =
    urlParams.get("lectureID");


  // ==========================================
  // SHOW RESULT
  // ==========================================

  function showResult(message, className) {

    document.getElementById("result").innerHTML =
      "<p class='" + className + "'>" +
      message +
      "</p>";

  }


  // ==========================================
  // CHECK LECTURE ID
  // ==========================================

  if (!lectureID) {

    showResult(
      "⚠️ No Lecture ID was provided.",
      "warning"
    );

  }

function escapeHtml(value) {

  return String(
    value == null ? "" : value
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
  // ==========================================
  // SEND ATTENDANCE TO APPS SCRIPT
  // ==========================================
// ==========================================
// BATCH ATTENDANCE PROCESSING
// ==========================================

const ATTENDANCE_BATCH_SIZE = 10;
const BATCH_MAX_WAIT_MS = 1500;
const ATTENDANCE_REQUEST_TIMEOUT_MS = 20000;
const MAX_BATCH_AUTOMATIC_RETRIES = 2;
const BATCH_RETRY_DELAY_MS = 4000;

let batchRetryCountByCode = new Map();
let batchRetryTimer = null;
let pendingStudentCodes = [];

let queuedOrInFlightCodes = new Set();
let completedStudentCodes = new Set();
let retryAfterByCode = new Map();

let batchProcessing = false;
let batchIdleTimer = null;


// ==========================================
// QUEUE STATUS
// ==========================================

function updateQueueStatus() {

  const element =
    document.getElementById("queueStatus");

  if (!element) {
    return;
  }

  const count =
    queuedOrInFlightCodes.size;

  element.textContent =
    count > 0
      ? count +
        " student(s) awaiting server confirmation."
      : "No pending attendance submissions.";

}


// ==========================================
// SCHEDULE A PARTIAL BATCH
// ==========================================

function scheduleBatchFlush() {

  if (
    pendingStudentCodes.length === 0 ||
    batchIdleTimer !== null
  ) {
    return;
  }

  batchIdleTimer = setTimeout(function() {

    batchIdleTimer = null;

    sendAttendanceBatch();

  }, BATCH_MAX_WAIT_MS);

}


// ==========================================
// SEND A BATCH TO APPS SCRIPT
// ==========================================

function sendAttendanceBatch() {

 if (
  batchProcessing ||
  batchRetryTimer !== null ||
  pendingStudentCodes.length === 0
) {
  return;
}

  if (batchIdleTimer !== null) {

    clearTimeout(batchIdleTimer);

    batchIdleTimer = null;

  }


  const batchCodes =
    pendingStudentCodes.splice(
      0,
      ATTENDANCE_BATCH_SIZE
    );


  batchProcessing = true;
const batchStartedAt = performance.now();

  updateQueueStatus();


  const requestStatusElement =
  document.getElementById("requestStatus");

if (requestStatusElement) {
  requestStatusElement.innerHTML =
    "<p class='info'>Submitting attendance for " +
    batchCodes.length +
    " student(s). Waiting in queue: " +
    pendingStudentCodes.length +
    ".</p>";
}

  const callbackName =
    "attendanceBatchCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 1000000);


  let finished = false;
  let timeoutHandle = null;
  let script = null;


  function cleanupRequest() {

    if (timeoutHandle !== null) {

      clearTimeout(timeoutHandle);

      timeoutHandle = null;

    }


    delete window[callbackName];


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(script);

    }

  }


  function finishBatch(
    response,
    errorMessage
  ) {

    if (finished) {
      return;
    }

  finished = true;

console.log("Attendance batch timing:", {
  batchSize: batchCodes.length,
  elapsedMs: Math.round(
    performance.now() - batchStartedAt
  ),
  transportError: !!errorMessage
});

cleanupRequest();

batchProcessing = false;

    // ========================================
    // TRANSPORT / RESPONSE ERRORS
    // ========================================

    const transportFailure =
      !!errorMessage ||
      !response ||
      (
        response.success !== false &&
        !Array.isArray(response.results)
      );

    if (transportFailure) {

      console.error(
        "Attendance batch request failed:",
        {
          errorMessage: errorMessage,
          batchSize: batchCodes.length,
          batchCodes: batchCodes,
          requestURL: script ? script.src : "",
          elapsedMs: Math.round(
            performance.now() - batchStartedAt
          )
        }
      );

      const retryCodes = [];
      const unresolvedCodes = [];

      batchCodes.forEach(function(code) {

        const attempts =
          batchRetryCountByCode.get(code) || 0;

        if (attempts < MAX_BATCH_AUTOMATIC_RETRIES) {

          batchRetryCountByCode.set(
            code,
            attempts + 1
          );

          // Keep this code marked as queued.
          retryCodes.push(code);

        } else {

          queuedOrInFlightCodes.delete(code);

          retryAfterByCode.set(
            code,
            Date.now() + 8000
          );

          unresolvedCodes.push(code);

        }

      });


      // Place retry codes before newer queued codes.
      if (retryCodes.length > 0) {

        if (batchIdleTimer !== null) {
          clearTimeout(batchIdleTimer);
          batchIdleTimer = null;
        }

        pendingStudentCodes =
          retryCodes.concat(pendingStudentCodes);

      }


      let message =
        "⚠️ The server response could not be confirmed.<br><br>";

      if (retryCodes.length > 0) {

        message +=
          "The system will retry " +
          retryCodes.length +
          " student(s) in " +
          (BATCH_RETRY_DELAY_MS / 1000) +
          " seconds. Previously saved records should be recognized as duplicates.";

      }

      if (unresolvedCodes.length > 0) {

        message +=
          "<br><br>These codes remain unconfirmed after retries: " +
          unresolvedCodes.map(escapeHtml).join(", ") +
          ". Check the Attendance sheet using the current Lecture ID.";

      }

      showResult(
        message,
        unresolvedCodes.length > 0 ? "error" : "warning"
      );


      const requestStatusElement =
        document.getElementById("requestStatus");

      if (requestStatusElement) {

        requestStatusElement.innerHTML =
          retryCodes.length > 0
            ? "<p class='warning'>Automatic retry scheduled. The batch is not yet confirmed.</p>"
            : "<p class='error'>Some attendance records remain unconfirmed. Check the Attendance sheet.</p>";

      }


      updateQueueStatus();


      if (retryCodes.length > 0) {

        if (batchRetryTimer !== null) {
          clearTimeout(batchRetryTimer);
        }

        batchRetryTimer = setTimeout(function() {

          batchRetryTimer = null;

          if (
            !batchProcessing &&
            pendingStudentCodes.length > 0
          ) {

            sendAttendanceBatch();

          } else {

            scheduleNextBatch();

          }

        }, BATCH_RETRY_DELAY_MS);

      } else {

        scheduleNextBatch();

      }

      return;

    }


    // ========================================
    // EXPLICIT SERVER REJECTION
    // ========================================

    if (
      !response.success ||
      !Array.isArray(response.results)
    ) {

      batchCodes.forEach(function(code) {

        queuedOrInFlightCodes.delete(code);

        retryAfterByCode.set(
          code,
          Date.now() + 8000
        );

      });


      showResult(
        "❌ The server rejected this batch.<br><br>" +
        escapeHtml(
          response.message ||
          "The server rejected the request."
        ) +
        "<br><br>Check that the lecture is open and that the lecturer is authorized.",
        "error"
      );


      const requestStatusElement =
        document.getElementById("requestStatus");

      if (requestStatusElement) {

        requestStatusElement.innerHTML =
          "<p class='error'>The server rejected the batch. See the message below.</p>";

      }


      updateQueueStatus();

      scheduleNextBatch();

      return;

    }
    // ========================================
    // PROCESS INDIVIDUAL RESULTS
    // ========================================

    let recordedCount = 0;
    let duplicateCount = 0;
    let errorCount = 0;

    const details = [];


    batchCodes.forEach(function(code, index) {

      const item =
        response.results[index];


      queuedOrInFlightCodes.delete(code);


      if (!item) {

        errorCount++;

        retryAfterByCode.set(
          code,
          Date.now() + 8000
        );

        details.push(
          "⚠️ " +
          escapeHtml(code) +
          ": No individual result received."
        );

        return;

      }


      // Prevent this QR from being resubmitted
      // repeatedly during the same scanner session.
      batchRetryCountByCode.delete(code);

      completedStudentCodes.add(code);


      const studentName =
        item.studentName || code;


      if (item.success) {

        recordedCount++;

        details.push(
          "✓ <strong>" +
          escapeHtml(studentName) +
          "</strong> — Attendance Recorded"
        );

      }

      else if (item.duplicate) {

        duplicateCount++;

        details.push(
          "⚠️ <strong>" +
          escapeHtml(studentName) +
          "</strong> — Already Recorded"
        );

      }

      else {

        errorCount++;

        details.push(
          "❌ <strong>" +
          escapeHtml(studentName) +
          "</strong> — " +
          escapeHtml(
            item.message ||
            "Attendance error."
          )
        );

      }

    });


    let resultClass = "success";

    if (errorCount > 0) {

      resultClass =
        recordedCount > 0
          ? "warning"
          : "error";

    } else if (duplicateCount > 0) {

      resultClass = "warning";

    }


    showResult(

      "<strong>Batch confirmation received</strong><br><br>" +

      "Recorded: " +
      recordedCount +

      " &nbsp; | &nbsp; Already recorded: " +
      duplicateCount +

      " &nbsp; | &nbsp; Errors: " +
      errorCount +

      "<br><br>" +

      details.join("<br>"),

      resultClass

    );


    updateQueueStatus();

    scheduleNextBatch();

  }


  // ==========================================
  // JSONP CALLBACK
  // ==========================================

  window[callbackName] =
    function(response) {

      finishBatch(
        response,
        null
      );

    };


  const scriptURL =

    APPS_SCRIPT_URL +

    "?action=recordAttendanceBatch" +

    "&lectureID=" +
    encodeURIComponent(lectureID) +

    "&studentCodes=" +
    encodeURIComponent(
      JSON.stringify(batchCodes)
    ) +

    "&callback=" +
    encodeURIComponent(callbackName);


  script =
    document.createElement("script");


  script.src = scriptURL;


  script.onerror =
    function() {

      finishBatch(
        null,
        "Unable to connect to the attendance server."
      );

    };


  timeoutHandle =
    setTimeout(function() {

      finishBatch(
        null,
        "The attendance server did not respond within 20 seconds."
      );

    }, ATTENDANCE_REQUEST_TIMEOUT_MS);


  document.body.appendChild(script);

}


// ==========================================
// SEND THE NEXT BATCH WHEN POSSIBLE
// ==========================================

function scheduleNextBatch() {

  if (
    batchProcessing ||
    pendingStudentCodes.length === 0
  ) {
    return;
  }


  if (
    pendingStudentCodes.length >=
    ATTENDANCE_BATCH_SIZE
  ) {

    sendAttendanceBatch();

  } else {

    scheduleBatchFlush();

  }

}


// ==========================================
// QR SCAN SUCCESS
// ==========================================

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (!lectureID) {

    showResult(
      "⚠️ No Lecture ID was provided.",
      "warning"
    );

    return;

  }


  const studentCode =
    String(decodedText || "").trim();


  if (!studentCode) {
    return;
  }


  // Ignore a QR already confirmed or
  // currently waiting for a server response.

  if (
    completedStudentCodes.has(studentCode) ||
    queuedOrInFlightCodes.has(studentCode)
  ) {
    return;
  }


  // Avoid immediately retrying a failed request.

  const retryUntil =
    retryAfterByCode.get(studentCode) || 0;


  if (Date.now() < retryUntil) {
    return;
  }


  retryAfterByCode.delete(studentCode);


  // Queue this unique QR.

  pendingStudentCodes.push(studentCode);

  queuedOrInFlightCodes.add(studentCode);


  updateQueueStatus();


  // Send immediately when five unique codes
  // have been collected.

  if (
    pendingStudentCodes.length >=
    ATTENDANCE_BATCH_SIZE
  ) {

    sendAttendanceBatch();

  } else {

    scheduleBatchFlush();

  }

}
  // ==========================================
  // NORMAL SCANNING ERRORS
  // ==========================================

  function onScanFailure(error) {

    // Ignore normal scanning failures.

  }


  // ==========================================
  // START CAMERA
  // ==========================================

  function startScanner() {

    if (!lectureID) {
      return;
    }


   window.html5QrCode =
  new Html5Qrcode(
    "reader",
    {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    }
  );

    const config = {

    fps: 12,

      qrbox: {
        width: 280,
        height: 280
      },

      aspectRatio: 1.0

    };


    window.html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      showResult(

        "✓ Camera Ready<br><br>" +
        "Lecture ID: " +
        lectureID +
        "<br><br>" +
        "Point the camera at the student's QR code.",

        "success"

      );

    })

    .catch(function(error) {

      showResult(

        "❌ Camera Error:<br>" +
        error,

        "error"

      );

    });

  }


  window.addEventListener(
    "load",
    startScanner
  );

</script>

</body>

</html>
