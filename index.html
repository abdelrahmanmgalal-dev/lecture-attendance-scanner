<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Lecture Attendance</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      font-size: 18px;
      min-height: 50px;
    }

    .success {
      color: #2e7d32;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .info {
      color: #1565c0;
      font-weight: bold;
    }

    .warning {
      color: #ef6c00;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="card">

    <h2>Lecture Attendance</h2>

    <p>
      Scan Student QR Code
    </p>

    <div id="reader"></div>

    <div id="result">

      <p class="info">
        Starting scanner...
      </p>

    </div>

  </div>


<script>

  // ==========================================
  // GOOGLE APPS SCRIPT WEB APP
  // ==========================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycby_WU_q5AD2U5f8pPG4u1LafAkDxoOKANCpEhM0umHSoeoAdeJtVnlqJiEvLLdBTnVuPw/exec";


  // ==========================================
  // GET LECTURE ID FROM URL
  // ==========================================

  const urlParams =
    new URLSearchParams(window.location.search);

  const lectureID =
    urlParams.get("lectureID");


  // ==========================================
  // SHOW RESULT
  // ==========================================

  function showResult(message, className) {

    document.getElementById("result").innerHTML =
      "<p class='" + className + "'>" +
      message +
      "</p>";

  }


  // ==========================================
  // CHECK LECTURE ID
  // ==========================================

  if (!lectureID) {

    showResult(
      "⚠️ No Lecture ID was provided.",
      "warning"
    );

  }


  // ==========================================
  // SEND ATTENDANCE TO APPS SCRIPT
  // ==========================================

  function sendAttendance(studentCode) {

    showResult(
      "Processing attendance...<br><br>" +
      "Student Code: " +
      studentCode,
      "info"
    );


    const callbackName =
      "attendanceCallback_" +
      Date.now();


    window[callbackName] =
      function(response) {

        if (response.success) {

          showResult(

            "✓ Attendance Recorded<br><br>" +

            "<strong>" +
            response.studentName +
            "</strong><br><br>" +

            "Student ID: " +
            response.studentID,

            "success"

          );

        }

        else if (response.duplicate) {

          showResult(

            "⚠️ Student Already Recorded<br><br>" +

            "<strong>" +
            response.studentName +
            "</strong><br><br>" +

            response.message,

            "warning"

          );

        }

        else {

          showResult(

            "❌ Attendance Error<br><br>" +
            response.message,

            "error"

          );

        }


        delete window[callbackName];

      };


    const scriptURL =

      APPS_SCRIPT_URL +

      "?action=recordAttendance" +

      "&lectureID=" +
      encodeURIComponent(lectureID) +

      "&studentCode=" +
      encodeURIComponent(studentCode) +

      "&callback=" +
      encodeURIComponent(callbackName);


    const script =
      document.createElement("script");


    script.src = scriptURL;


    script.onerror =
      function() {

        showResult(

          "❌ Unable to connect to attendance system.",

          "error"

        );

        delete window[callbackName];

      };


    document.body.appendChild(script);

  }


  // ==========================================
  // QR SCAN SUCCESS
  // ==========================================

  let processing = false;


  function onScanSuccess(decodedText, decodedResult) {

    if (processing) {
      return;
    }


    processing = true;


    // Stop repeated scans temporarily

    if (window.html5QrCode) {

      window.html5QrCode.pause(true);

    }


    sendAttendance(decodedText.trim());


    // Allow another scan after 4 seconds

    setTimeout(function() {

      processing = false;

      if (window.html5QrCode) {

        window.html5QrCode.resume();

      }

    }, 4000);

  }


  // ==========================================
  // NORMAL SCANNING ERRORS
  // ==========================================

  function onScanFailure(error) {

    // Ignore normal scanning failures.

  }


  // ==========================================
  // START CAMERA
  // ==========================================

  function startScanner() {

    if (!lectureID) {
      return;
    }


    window.html5QrCode =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: {
        width: 280,
        height: 280
      },

      aspectRatio: 1.0

    };


    window.html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      showResult(

        "✓ Camera Ready<br><br>" +
        "Lecture ID: " +
        lectureID +
        "<br><br>" +
        "Point the camera at the student's QR code.",

        "success"

      );

    })

    .catch(function(error) {

      showResult(

        "❌ Camera Error:<br>" +
        error,

        "error"

      );

    });

  }


  window.addEventListener(
    "load",
    startScanner
  );

</script>

</body>

</html>
