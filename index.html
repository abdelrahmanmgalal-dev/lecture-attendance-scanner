<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Lecture Attendance</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      font-size: 18px;
      min-height: 50px;
    }

    .success {
      color: #2e7d32;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .info {
      color: #1565c0;
      font-weight: bold;
    }

    .warning {
      color: #ef6c00;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="card">

    <h2>Lecture Attendance</h2>

    <p>
      Scan Student QR Code
    </p>

    <div id="reader"></div>

    <div id="result">

      <p class="info">
        Starting scanner...
      </p>

    </div>

  </div>


<script>

  // ==========================================
  // GOOGLE APPS SCRIPT WEB APP
  // ==========================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycby_WU_q5AD2U5f8pPG4u1LafAkDxoOKANCpEhM0umHSoeoAdeJtVnlqJiEvLLdBTnVuPw/exec";


  // ==========================================
  // GET LECTURE ID FROM URL
  // ==========================================

  const urlParams =
    new URLSearchParams(window.location.search);

  const lectureID =
    urlParams.get("lectureID");


  // ==========================================
  // SHOW RESULT
  // ==========================================

  function showResult(message, className) {

    document.getElementById("result").innerHTML =
      "<p class='" + className + "'>" +
      message +
      "</p>";

  }


  // ==========================================
  // CHECK LECTURE ID
  // ==========================================

  if (!lectureID) {

    showResult(
      "⚠️ No Lecture ID was provided.",
      "warning"
    );

  }

function escapeHtml(value) {

  return String(
    value == null ? "" : value
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
  // ==========================================
  // SEND ATTENDANCE TO APPS SCRIPT
  // ==========================================

 function sendAttendance(studentCode) {

  showResult(
    "Processing attendance...<br><br>" +
    "Student Code: " +
    escapeHtml(studentCode),
    "info"
  );


  const callbackName =
    "attendanceCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 1000000);


  let completed = false;

  let requestTimeout = null;

  let script = null;


  // ==========================================
  // CLEAN UP REQUEST
  // ==========================================

  function cleanupRequest() {

    if (requestTimeout !== null) {

      clearTimeout(requestTimeout);

      requestTimeout = null;

    }


    delete window[callbackName];


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }


  // ==========================================
  // FINISH REQUEST AND RESUME SCANNER
  // ==========================================

  function finishRequest(
    response,
    errorMessage
  ) {

    // Prevent handling the same response twice.

    if (completed) {
      return;
    }


    completed = true;

    cleanupRequest();


    if (errorMessage) {

      showResult(
        errorMessage,
        "error"
      );

    }

    else if (
      !response
    ) {

      showResult(
        "❌ No response was received from the attendance server.",
        "error"
      );

    }

    else if (
      response.success
    ) {

      showResult(

        "✓ Attendance Recorded<br><br>" +

        "<strong>" +
        escapeHtml(
          response.studentName
        ) +
        "</strong><br><br>" +

        "Student ID: " +
        escapeHtml(
          response.studentID
        ),

        "success"

      );

    }

    else if (
      response.duplicate
    ) {

      showResult(

        "⚠️ Student Already Recorded<br><br>" +

        "<strong>" +
        escapeHtml(
          response.studentName
        ) +
        "</strong><br><br>" +

        escapeHtml(
          response.message
        ),

        "warning"

      );

    }

    else {

      showResult(

        "❌ Attendance Error<br><br>" +

        escapeHtml(
          response.message ||
          "Attendance could not be recorded."
        ),

        "error"

      );

    }


    // Small cooldown after receiving the response.
    // Do not wait a fixed 4 seconds for every scan.

    setTimeout(function() {

      processing = false;


      if (
        window.html5QrCode
      ) {

        try {

          window.html5QrCode.resume();

        }

        catch (error) {

          console.warn(
            "Scanner resume:",
            error
          );

        }

      }

    }, 900);

  }


  // ==========================================
  // JSONP CALLBACK
  // ==========================================

  window[callbackName] =
    function(response) {

      finishRequest(
        response,
        null
      );

    };


  const scriptURL =

    APPS_SCRIPT_URL +

    "?action=recordAttendance" +

    "&lectureID=" +
    encodeURIComponent(
      lectureID
    ) +

    "&studentCode=" +
    encodeURIComponent(
      studentCode
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script =
    document.createElement("script");


  script.src =
    scriptURL;


  script.onerror =
    function() {

      finishRequest(

        null,

        "❌ Unable to connect to the attendance system. Check the connection before scanning again."

      );

    };


  // Safety timeout in case the server never responds.

  requestTimeout =
    setTimeout(function() {

      finishRequest(

        null,

        "⚠️ The attendance server did not respond in time. The record may still have been saved. Check the attendance report before retrying this student."

      );

    }, 20000);


  document.body.appendChild(
    script
  );

}

// ==========================================
// QR SCAN SUCCESS
// ==========================================

let processing = false;


function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (processing) {
    return;
  }


  if (!lectureID) {

    showResult(
      "⚠️ No Lecture ID was provided.",
      "warning"
    );

    return;

  }


  const studentCode =
    String(
      decodedText || ""
    ).trim();


  if (!studentCode) {
    return;
  }


  // Block new scans until the current request finishes.

  processing = true;


  try {

    if (window.html5QrCode) {

      window.html5QrCode.pause(true);

    }

  }

  catch (error) {

    console.warn(
      "Unable to pause scanner:",
      error
    );

  }


  sendAttendance(
    studentCode
  );

}
  // ==========================================
  // NORMAL SCANNING ERRORS
  // ==========================================

  function onScanFailure(error) {

    // Ignore normal scanning failures.

  }


  // ==========================================
  // START CAMERA
  // ==========================================

  function startScanner() {

    if (!lectureID) {
      return;
    }


    window.html5QrCode =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: {
        width: 280,
        height: 280
      },

      aspectRatio: 1.0

    };


    window.html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      showResult(

        "✓ Camera Ready<br><br>" +
        "Lecture ID: " +
        lectureID +
        "<br><br>" +
        "Point the camera at the student's QR code.",

        "success"

      );

    })

    .catch(function(error) {

      showResult(

        "❌ Camera Error:<br>" +
        error,

        "error"

      );

    });

  }


  window.addEventListener(
    "load",
    startScanner
  );

</script>

</body>

</html>
