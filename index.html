<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Lecture Attendance</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      font-size: 18px;
      min-height: 40px;
    }

    .success {
      color: #2e7d32;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .info {
      color: #1565c0;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="card">

    <h2>Lecture Attendance</h2>

    <p>
      Scan Student QR Code
    </p>

    <div id="reader"></div>

    <div id="result">

      <p class="info">
        Starting scanner...
      </p>

    </div>

  </div>


  <script>

    function showResult(message, className) {

      document.getElementById("result").innerHTML =
        "<p class='" + className + "'>" +
        message +
        "</p>";

    }


    function onScanSuccess(decodedText, decodedResult) {

      showResult(
        "✓ QR Code Detected<br><br>" +
        "<strong>Student Code:</strong><br>" +
        decodedText,
        "success"
      );

      console.log("QR Code:", decodedText);

    }


    function onScanFailure(error) {

      // Normal scanning failures are ignored.
      // They happen continuously while the camera
      // is looking for a QR code.

    }


    function startScanner() {

      const html5QrCode =
        new Html5Qrcode("reader");


      const config = {

        fps: 10,

        qrbox: {
          width: 280,
          height: 280
        },

        aspectRatio: 1.0

      };


      html5QrCode.start(

        {
          facingMode: "environment"
        },

        config,

        onScanSuccess,

        onScanFailure

      )

      .then(function() {

        showResult(
          "✓ Camera Ready<br><br>" +
          "Place the Student QR Code inside the square.",
          "success"
        );

      })

      .catch(function(error) {

        showResult(
          "Camera Error:<br>" + error,
          "error"
        );

      });

    }


    window.addEventListener(
      "load",
      startScanner
    );

  </script>

</body>

</html>
